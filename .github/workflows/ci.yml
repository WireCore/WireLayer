# Checks, build, axe and E2E in the browser. Publishing: release.yml
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    TURBO_TELEMETRY_DISABLED: '1'
    STORYBOOK_DISABLE_TELEMETRY: '1'
    NEXT_TELEMETRY_DISABLED: '1'
    NUXT_TELEMETRY_DISABLED: '1'

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: pnpm lint
            - run: pnpm format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: pnpm typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: pnpm test

    # Licences of the published packages' dependencies and peers against an allowlist (scripts/check-licenses.ts)
    licenses:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: pnpm licenses:check

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: pnpm build
            - run: pnpm build-storybook
            - uses: actions/upload-artifact@v4
              with:
                  name: build
                  retention-days: 7
                  # .output and .next are hidden folders
                  include-hidden-files: true
                  path: |
                      packages/*/dist
                      packages/*/storybook-static
                      apps/storybook/storybook-static
                      apps/nuxt/.output
                      apps/next/.next
                      !apps/next/.next/cache/**

    # axe in a real browser against every story of the Vue, React, React Native and HTML Storybooks (all modes and themes)
    # – one job per Storybook, so they run side by side
    a11y:
        name: a11y (${{ matrix.storybook }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 90
        container: mcr.microsoft.com/playwright:v1.64.1-noble
        strategy:
            fail-fast: false
            matrix:
                storybook: [vue, react, native, css]
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  build-tokens: 'false'
            - uses: actions/download-artifact@v4
              with:
                  name: build
            - working-directory: packages/parity
              run: node scripts/storybook-a11y.ts ../${{ matrix.storybook }}/storybook-static

    # Keyboard/interaction tests in a real browser, each spec against Vue and React (e2e/native: React Native,
    # e2e/apps: the Nuxt and Next.js demo apps)
    # – one job per Playwright project, so they run side by side
    e2e:
        name: e2e (${{ matrix.name }})
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 60
        container: mcr.microsoft.com/playwright:v1.64.1-noble
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: vue, projects: --project vue }
                    - { name: react, projects: --project react }
                    - { name: native, projects: --project native }
                    - { name: css, projects: --project css }
                    - { name: visual, projects: --project visual }
                    - { name: apps, projects: --project nuxt --project next }
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
              with:
                  build-tokens: 'false'
            - uses: actions/download-artifact@v4
              with:
                  name: build
            - working-directory: packages/parity
              run: STORYBOOK_STATIC=1 npx playwright test ${{ matrix.projects }}
            # once more with animations – keyboard and focus must also work while overlays animate (screenshots only
            # without)
            - if: matrix.name != 'visual'
              working-directory: packages/parity
              run: STORYBOOK_STATIC=1 E2E_MOTION=1 npx playwright test ${{ matrix.projects }}
