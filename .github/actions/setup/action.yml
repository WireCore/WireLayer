# Same toolchain as docker/node.Dockerfile: Node 26, pnpm 12, dependencies from the lockfile
name: Setup
description: Node, pnpm and the workspace dependencies
inputs:
    build-tokens:
        description: Build @wirecore/wirelayer-tokens (theme.css) after installing
        default: 'true'
runs:
    using: composite
    steps:
        - uses: actions/setup-node@v5
          with:
              node-version: 26
        - shell: bash
          run: npm install -g pnpm@12.14.0
        - id: store
          shell: bash
          run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        - uses: actions/cache@v4
          with:
              path: ${{ steps.store.outputs.path }}
              key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
              restore-keys: pnpm-store-${{ runner.os }}-
        - shell: bash
          run: pnpm install --frozen-lockfile
        - if: inputs.build-tokens == 'true'
          shell: bash
          run: pnpm build:tokens
